<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Auth Test - Promper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card p {
            line-height: 1.6;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .status.success {
            background: #10b981;
        }

        .status.error {
            background: #ef4444;
        }

        .status.info {
            background: #3b82f6;
        }

        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.success {
            color: #10b981;
        }

        .log-entry.error {
            color: #ef4444;
        }

        .log-entry.info {
            color: #60a5fa;
        }

        button {
            background: #fff;
            color: #764ba2;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        button:active {
            transform: scale(0.98);
        }

        .code-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            word-break: break-all;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔬 Mobile Auth Test</h1>

        <div class="card">
            <h2>📱 Environment</h2>
            <p><strong>User Agent:</strong></p>
            <div class="code-display" id="userAgent"></div>
            <p style="margin-top: 12px;"><strong>Viewport:</strong> <span id="viewport"></span></p>
        </div>

        <div class="card">
            <h2>🔐 Auth Status</h2>
            <p id="authStatus">Checking...</p>
            <div id="sessionInfo"></div>
        </div>

        <div class="card">
            <h2>🔗 URL Parameters</h2>
            <p id="urlParams">None detected</p>
        </div>

        <div class="card">
            <h2>💾 Local Storage</h2>
            <p id="localStorage">Checking...</p>
        </div>

        <div class="card">
            <h2>📋 Console Log</h2>
            <div class="log" id="logContainer">
                <div class="log-entry info">Test initialized...</div>
            </div>
            <button onclick="window.location.href='app.html'">Open Main App</button>
            <button onclick="clearData()">Clear All Data</button>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }

        // Display environment
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('viewport').textContent = `${window.innerWidth}x${window.innerHeight}`;

        // Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1));

        const authCode = urlParams.get('code') || hashParams.get('code');
        const accessToken = hashParams.get('access_token');
        const error = urlParams.get('error') || hashParams.get('error');

        if (authCode || accessToken || error) {
            log('🔐 Auth parameters detected!', 'success');
            let paramHtml = '';
            if (authCode) paramHtml += `<p>✅ Code: ${authCode.substring(0, 20)}...</p>`;
            if (accessToken) paramHtml += `<p>✅ Access Token: ${accessToken.substring(0, 20)}...</p>`;
            if (error) paramHtml += `<p>❌ Error: ${error}</p>`;
            document.getElementById('urlParams').innerHTML = paramHtml;
        } else {
            log('No auth parameters in URL', 'info');
        }

        // Check localStorage
        try {
            const keys = Object.keys(localStorage);
            const sessionKey = keys.find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));

            if (sessionKey) {
                const sessionData = JSON.parse(localStorage.getItem(sessionKey));

                if (sessionData && sessionData.access_token) {
                    log('✅ Session found in localStorage', 'success');

                    const expiresAt = sessionData.expires_at;
                    const now = Math.floor(Date.now() / 1000);
                    const isExpired = expiresAt && expiresAt < now;

                    document.getElementById('authStatus').innerHTML =
                        `<span class="status success">✅ Logged In</span>`;

                    document.getElementById('sessionInfo').innerHTML = `
                        <p style="margin-top: 12px;"><strong>User:</strong> ${sessionData.user?.email || 'Unknown'}</p>
                        <p><strong>Expires:</strong> ${isExpired ? '❌ Expired' : '✅ Valid'}</p>
                    `;

                    document.getElementById('localStorage').innerHTML =
                        `<span class="status success">✅ Session Stored</span>
                        <div class="code-display" style="margin-top: 8px;">
                            Token: ${sessionData.access_token.substring(0, 30)}...<br>
                            Key: ${sessionKey}
                        </div>`;
                } else {
                    log('⚠️ Invalid session data', 'error');
                    document.getElementById('authStatus').innerHTML =
                        `<span class="status error">❌ Not Logged In</span>`;
                    document.getElementById('localStorage').innerHTML =
                        `<span class="status error">⚠️ Invalid Session</span>`;
                }
            } else {
                log('No session found in localStorage', 'info');
                document.getElementById('authStatus').innerHTML =
                    `<span class="status info">ℹ️ Guest Mode</span>`;
                document.getElementById('localStorage').innerHTML =
                    `<span class="status info">Empty</span>`;
            }
        } catch (e) {
            log('❌ Error checking localStorage: ' + e.message, 'error');
            document.getElementById('localStorage').innerHTML =
                `<span class="status error">Error</span>`;
        }

        // Test localStorage access
        try {
            localStorage.setItem('_test', '1');
            localStorage.removeItem('_test');
            log('✅ localStorage is accessible', 'success');
        } catch (e) {
            log('❌ localStorage is blocked: ' + e.message, 'error');
        }

        // Detect browser type
        const ua = navigator.userAgent;
        let browserType = 'Unknown';
        if (ua.includes('Instagram')) browserType = 'Instagram In-App';
        else if (ua.includes('FBAN') || ua.includes('FBAV')) browserType = 'Facebook In-App';
        else if (ua.includes('GSA/')) browserType = 'Google App In-App';
        else if (ua.includes('SamsungBrowser')) browserType = 'Samsung Internet';
        else if (ua.includes('CriOS')) browserType = 'Chrome iOS';
        else if (ua.includes('FxiOS')) browserType = 'Firefox iOS';
        else if (ua.includes('Safari') && !ua.includes('Chrome')) browserType = 'Safari';
        else if (ua.includes('Chrome')) browserType = 'Chrome';

        log(`Browser detected: ${browserType}`, 'info');

        function clearData() {
            if (confirm('Clear all localStorage data?')) {
                localStorage.clear();
                log('🗑️ All data cleared', 'success');
                setTimeout(() => window.location.reload(), 500);
            }
        }

        // Auto-redirect if auth params present
        if (authCode || accessToken) {
            log('⏳ Redirecting to main app in 3 seconds...', 'info');
            setTimeout(() => {
                log('🚀 Redirecting...', 'success');
                window.location.href = 'app.html' + window.location.search + window.location.hash;
            }, 3000);
        }
    </script>
</body>

</html>
